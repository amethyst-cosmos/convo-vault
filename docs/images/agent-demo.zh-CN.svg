      <stop offset="0" stop-color="#6d4aff"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <rect x="20" y="14" width="960" height="442" rx="22" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <rect x="20" y="14" width="960" height="52" rx="22" fill="#f3f4f6"/>
    <rect x="20" y="44" width="960" height="22" fill="#f3f4f6"/>
    <circle cx="52" cy="40" r="7" fill="#ff5f57"/>
    <circle cx="76" cy="40" r="7" fill="#febc2e"/>
    <circle cx="100" cy="40" r="7" fill="#28c840"/>
    <text x="500" y="46" text-anchor="middle" font-size="15" fill="#6b7280">Claude Code · Codex · Claude 桌面版</text>

    <rect x="470" y="92" width="480" height="104" rx="20" fill="url(#user)"/>
