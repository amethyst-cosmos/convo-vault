name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install PDF backend dependencies
        working-directory: renderer
        run: pnpm install --frozen-lockfile

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Build release package
        run: npm run package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/convo-vault-*.zip --title "Convo Vault ${GITHUB_REF_NAME#v}" --generate-notes
